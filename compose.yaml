services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: api_key_bridge
      POSTGRES_USER: api_key_bridge
      POSTGRES_PASSWORD: ${BRIDGE_DEV_POSTGRES_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_key_bridge -d api_key_bridge"]
      interval: 2s
      retries: 10
