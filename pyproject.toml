[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keycloak-api-key-bridge"
version = "0.5.3"
description = "Keycloak-backed API key management and authorization bridge for AgentGateway."
authors = [{ name = "neurwerk", email = "dev@neurwerk.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0",
    "python-jose[cryptography]>=3.3",
    "pydantic-settings>=2.7",
    "httpx>=0.28.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
]

[project.scripts]
keycloak-api-key-bridge = "keycloak_api_key_bridge.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keycloak_api_key_bridge"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ty]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["ruff>=0.15.17", "ty>=0.0.49", "pytest>=8", "httpx>=0.28"]

[project.urls]
Homepage = "https://github.com/neurwerk/k8s_stack_keycloak_api_key_bridge"
Repository = "https://github.com/neurwerk/k8s_stack_keycloak_api_key_bridge"
Issues = "https://github.com/neurwerk/k8s_stack_keycloak_api_key_bridge/issues"
Security = "https://github.com/neurwerk/k8s_stack_keycloak_api_key_bridge/security/policy"
